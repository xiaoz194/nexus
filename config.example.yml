# Nexus 配置示例：复制为 config.yml 并填入真实值。
# config.yml 含密钥，已被 .gitignore 忽略，不要提交。

server:
  port: "8080"

database:
  # postgres（默认）或 sqlite
  type: postgres
  # postgres: postgres://<user>:<password>@<host>:5432/<db>?sslmode=disable
  # sqlite:   文件路径，如 nexus.db
  dsn: postgres://postgres:<password>@<host>:5432/nexus?sslmode=disable

llm:
  # API 根地址。provider=openai 会自动追加 /chat/completions；
  # provider=anthropic 会自动追加 /v1/messages。换厂商只改这一行：
  #   DeepSeek:   https://api.deepseek.com
  #   通义千问:   https://dashscope.aliyuncs.com/compatible-mode/v1
  #   Kimi:       https://api.moonshot.cn/v1
  #   智谱GLM:    https://open.bigmodel.cn/api/paas/v4
  #   OpenAI:     https://api.openai.com/v1
  #   本地vLLM:   http://localhost:8000/v1
  #   Claude原生: https://api.anthropic.com
  base_url: https://api.deepseek.com
  # 对应厂商的 API Key，留空则只有 mock provider 可用。
  api_key: ""
  # 默认模型名；Agent 未填 model_name 时用它。
  model: deepseek-chat
  # 仅 provider=anthropic（Claude 原生）需要：单次回复最大 token（Anthropic 强制要求）。
  max_tokens: 4096
  # HTTP 请求超时（秒）。
  timeout_seconds: 60

auth:
  # 登录会话有效期（小时），默认 168=7 天。
  session_ttl_hours: 168
  # 生产环境（HTTPS）置 true，让会话 cookie 带 Secure 标记；本地 dev 保持 false。
  cookie_secure: false
